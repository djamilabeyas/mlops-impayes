name: CI-CD
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install ruff
      - run: ruff check src tests flows

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: pytest -q --maxfail=1

    train:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: Données (DVC, sinon téléchargement direct depuis Hugging Face)
        run: dvc pull || python -m src.data
      - name: Entraînement (échoue si la gate F1/AUC n'est pas atteinte)
        run: python -m src.train
        env: {MLFLOW_TRACKING_URI: "${{ secrets.MLFLOW_TRACKING_URI }}"}
      - name: Résumé du registre MLflow
        if: always()
        continue-on-error: true
        env: {MLFLOW_TRACKING_URI: "${{ secrets.MLFLOW_TRACKING_URI }}"}
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import os, mlflow
          from mlflow.tracking import MlflowClient
          mlflow.set_tracking_uri(os.getenv("MLFLOW_TRACKING_URI") or "sqlite:///mlflow.db")
          c = MlflowClient()
          print("## Registre de modèles MLflow")
          for m in c.search_registered_models():
              print(f"**{m.name}** : alias {dict(m.aliases)}")
              print("| Version | F1 | AUC | Commit |\n|---|---|---|---|")
              for v in c.search_model_versions(f"name='{m.name}'"):
                  r = c.get_run(v.run_id)
                  print(f"| {v.version} | {r.data.metrics.get('f1', 0):.3f} | {r.data.metrics.get('auc', 0):.3f} | {r.data.tags.get('git_commit', '')} |")
          PY
      - name: Simulation de drift (preuve de détection)
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import pandas as pd
          from src.monitoring.drift import drift_report
          ref = pd.read_csv("models/reference.csv")
          cur = ref.copy()
          num = ref.select_dtypes("number").nunique().idxmax()
          cur[num] = cur[num] * 1.5
          r = drift_report(ref, cur)
          print("## Simulation de data drift (colonne " + num + " multipliée par 1,5)")
          print("| Variable | PSI |\n|---|---|")
          for k, v in sorted(r["psi"].items(), key=lambda x: -x[1]):
              print(f"| {k} | {v:.3f} |")
          print("\nDrift détecté :", r["drift_detected"], "- variables :", r["drifted_features"])
          PY
      - name: Sauvegarde du modèle et des métriques (même en cas d'échec)
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: model, path: models/, if-no-files-found: warn}

  validate:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pyyaml
      - uses: actions/download-artifact@v4
        with: {name: model, path: models/}
      - name: Gate de validation (F1 et AUC)
        run: |
          python - <<'PY'
          import json, sys, yaml
          m = json.load(open("models/metrics.json"))
          g = yaml.safe_load(open("params.yaml"))["gate"]
          print(m, g)
          sys.exit(0 if m["f1"] >= g["min_f1"] and m["auc"] >= g["min_auc"] else 1)
          PY

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: model, path: models/}
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - run: docker build -t $IMAGE:${{ github.sha }} .
      # Épinglé sur le commit de la v0.35.0 : les anciens tags ont été compromis en mars 2026 (CVE-2026-33634)
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: "${{ env.IMAGE }}:${{ github.sha }}"
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - run: docker push $IMAGE:${{ github.sha }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: model, path: models/}
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Déploiement de l'image publiée (staging)
        run: |
          docker pull $IMAGE:${{ github.sha }}
          docker run -d --name default-risk-api -p 8000:8000 $IMAGE:${{ github.sha }}
      - name: Tests de fumée (/health, /predict, /docs, /metrics)
        run: python scripts/smoke_test.py http://localhost:8000 models/reference.csv
      - name: Journaux de l'API
        if: always()
        run: docker logs default-risk-api

  deploy-production:
    needs: deploy-staging
    # activé seulement si un serveur est configuré (variable DEPLOY_SSH = true + secrets SSH_*)
    if: vars.DEPLOY_SSH == 'true'
    runs-on: ubuntu-latest
    environment: production   # approbation manuelle configurable dans Settings > Environments
    steps:
      - name: Déploiement sur le serveur
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
            docker rm -f default-risk-api || true
            docker run -d --name default-risk-api -p 8000:8000 \
              ghcr.io/${{ github.repository }}:${{ github.sha }}
            sleep 5 && curl -f http://localhost:8000/health
