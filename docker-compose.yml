services:
  # Entraînement : docker compose run --rm train  (télécharge les données si besoin, entraîne, enregistre dans MLflow)
  train:
    build: {context: ., dockerfile: Dockerfile.train}
    image: mlops-impayes-tools
    working_dir: /app
    volumes:
      - .:/app
    command: python -m src.train
    profiles: [train]
  api:
    build: .
    ports: ["8000:8000"]
    restart: unless-stopped
  mlflow:
    build: {context: ., dockerfile: Dockerfile.train}
    image: mlops-impayes-tools
    working_dir: /app
    command: >
      python -m mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////app/mlflow.db
      --default-artifact-root /app/mlruns
    volumes:
      - .:/app
    ports: ["5000:5000"]
  prometheus:
    image: prom/prometheus:v2.50.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
    ports: ["9090:9090"]
    depends_on: [api]
  grafana:
    image: grafana/grafana:10.3.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mlops.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports: ["3000:3000"]
    depends_on: [prometheus]
