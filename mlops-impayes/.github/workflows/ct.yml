name: CT-continuous-training
on:
  schedule: [{cron: "0 3 * * 1"}]
  workflow_dispatch:
  repository_dispatch: {types: [drift-alert]}
jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt && dvc pull
      - run: python -m src.train
        env: {MLFLOW_TRACKING_URI: "${{ secrets.MLFLOW_TRACKING_URI }}"}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: metrics, path: models/metrics.json}
