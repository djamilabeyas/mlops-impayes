data:
  hf_dataset: electricsheepafrica/africa-synth-telecom-telecom-credit-scoring-data-nigeria
  raw_path: data/raw/telecom.csv
  target: default_risk
  # default_risk vaut low / medium / high : « high » = impayé (1), le reste = 0
  positive_labels: [high]
  # identifiants personnels (inutiles et sensibles) + date constante sur tout le jeu
  drop_columns: [customer_id, phone_number, assessment_date]
  test_size: 0.2
  seed: 42
train:
  max_iter: 200
  learning_rate: 0.1
gate:
  # Référence mesurée sur les 500 000 lignes : F1 = 0,58, AUC = 0,75.
  # Seuils juste en dessous : on bloque un modèle qui régresse, pas le modèle de référence.
  min_f1: 0.55
  min_auc: 0.72
monitoring:
  psi_threshold: 0.2
  f1_threshold: 0.50   # alerte si le F1 réel passe sous 0,50 (référence 0,58)
  latency_p95_s: 0.3
  error_rate: 0.01
